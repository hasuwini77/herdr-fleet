id = "hasuwini77.fleet"
name = "Worktree Fleet"
version = "0.12.0"
min_herdr_version = "0.7.4"
description = "Parallel bucket builds for Claude Code and Codex: /fleet skill installer + a live fleet popup"
platforms = ["linux", "macos"]

[[actions]]
id = "install"
title = "Fleet: install skills"
contexts = ["workspace"]
command = ["bash", "install.sh"]

[[actions]]
id = "show"
title = "Fleet: show board"
contexts = ["workspace"]
command = ["bash", "plugin/open-board.sh"]

[[panes]]
id = "board"
title = "Fleet board"
placement = "popup"
width = "80%"
height = "60%"
command = ["bash", "plugin/board.sh"]
